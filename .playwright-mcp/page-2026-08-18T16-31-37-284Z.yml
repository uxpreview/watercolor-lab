        - heading [level=1] [ref=e12]:
          - text: A sprinkler plan for
          - emphasis [ref=e13]: your
          - text: yard, not mine.
        - paragraph [ref=e14]: Draw the lot, say what your spigot actually delivers, and this places the heads, sizes the nozzles to the shape of each piece of ground, packs the zones under your flow budget, routes the trenches around the house and prints a dig plan you can take to the store. It runs entirely in your browser — no account, no address, no server.
