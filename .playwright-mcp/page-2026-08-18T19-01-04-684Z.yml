      - heading "How it works" [level=2] [ref=f3e48]
      - generic [ref=f3e50]:
        - generic [ref=f3e51]:
          - heading "1 · Size the nozzle to the shape" [level=3] [ref=f3e52]
          - paragraph [ref=f3e53]: The tool measures the largest circle that fits inside each piece of ground — the real "how wide is this" — rather than its area. A 2,000 sq ft lawn and a 2,000 sq ft side strip want completely different heads, and area alone cannot tell them apart. Wide open ground gets gear rotors, ordinary lawns get rotary nozzles, narrow strips get fixed sprays. Then the throw is stepped down until at least three heads fit one zone's flow budget — on a small meter you run more, smaller heads per valve, not one big rotor at a time.
        - generic [ref=f3e54]:
          - heading "2 · Ring the edge, fill the middle" [level=3] [ref=f3e55]
          - paragraph [ref=f3e56]: "Heads go on the corners first, with the arc matched to the interior angle and aimed down the bisector, then along the edges as half circles facing in, then on a triangular lattice wherever the perimeter ring cannot reach. Spacing is head-to-head: every head throws far enough to hit its neighbour. That looks like absurd overlap on paper and it is the entire trick — a single head puts down most of its water close in, so anything less leaves dry rings you cannot fix by turning the water up."
        - generic [ref=f3e57]:
          - heading "3 · Prune what earns nothing" [level=3] [ref=f3e58]
          - paragraph [ref=f3e59]: The corner and edge passes double up, so a greedy pass tries removing each head cheapest-first and keeps the removal only if coverage holds and the head-to-head overlap barely moves. Set cover is NP-hard; a yard does not deserve a branch-and-bound. This typically drops a third of the placements.
        - generic [ref=f3e60]:
          - heading "4 · Pack zones under the flow budget" [level=3] [ref=f3e61]
          - paragraph [ref=f3e62]:
            - text: Your spigot is the constraint that decides everything. Heads are walked in a nearest-neighbour chain from the water source and packed into zones at 85 % of measured flow, so a zone is a contiguous
            - emphasis [ref=f3e63]: place
            - text: in the yard rather than a scattering, and no valve is sized at 100 % of a bucket test. The supply fixes how many valves; the chain is then re-cut into that many runs so the busiest zone draws as little as possible and no head is stranded on a valve of its own.
        - generic [ref=f3e64]:
          - heading "5 · Trench as a spanning tree" [level=3] [ref=f3e65]
          - paragraph [ref=f3e66]: "Each zone gets a minimum spanning tree from its nearest source out to every head, and every edge of it is a routed run: straight where the line stays clear of every building, and otherwise bent around the corners by the shortest path, so the trench on the plan is a trench you can dig. Paving is a price rather than a wall — a walk can be sleeved."
        - generic [ref=f3e67]:
          - heading "What it is not" [level=3] [ref=f3e68]
          - paragraph [ref=f3e69]: Not a hydraulic design. Nozzle flow and throw are catalogue approximations, friction loss in the pipe is not modelled, and nothing here knows your local code, your backflow requirements or where your utilities are buried. It is close enough to size zones and argue with a parts list. It is not close enough to skip a pressure gauge, a bucket, or a call before you dig.
